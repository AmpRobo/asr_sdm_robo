/**:
  ros__parameters:
    features:
      # Load and display the asr_sdm robot model in RViz.
      use_asr_sdm_model: true
      # Start asr_sdm_control_manager when control:=enable.
      use_kinematic_controller: true
      # Start RViz with the package rviz config.
      use_rviz: true

    topics:
      # Pose source for odom_visualization (world->base) and planning.
      vins_odom: /localization/video_inertial_navigation_systems/odometry
      # Published by asr_sdm_control_manager when control:=enable (not used for model pose).
      sim_odom: /control/asr_sdm/odom
      initialpose: /control/initial_pose
      joint_states: /control/joint_states
      robot_cmd: /control/asr_sdm/robot_cmd
      controller_state: /control/asr_sdm/controller_state_3d
      control_cmd: /control/asr_sdm/control_cmd_3d
      goal_pose: /goal_pose

    odom_visualization:
      color: {a: 0.8, r: 1.0, g: 0.0, b: 0.0}
      covariance_scale: 100.0
      # VINS odom is IMU (look along +Z). Rotate onto ROS base (+X forward) for the model TF.
      tf_roll: 0.0
      tf_pitch: -1.5707963267948966
      tf_yaw: 3.141592653589793

    robot_model:
      # URDF root is base (same frame as odom world->base). No extra static TF.
      parent_frame: base
      child_frame: base
      use_sim_time: false
      model_xacro: urdf/asr_sdm_wrapper.urdf.xacro
