/**:
  ros__parameters:
    features:
      # Start asr_sdm_map_generator (random forest map).
      use_asr_sdm_map_generator: true
      # Click RViz "Static Obstacle" tool (/simulator/planning_simulator/add_static_obstacle) to add pillar obstacles.
      enable_click_map: true
      # Load and display the asr_sdm robot model in RViz.
      use_asr_sdm_model: true
      # Start the kinematic controller that drives the robot model. Without it nothing
      # publishes joint states or odometry, so the model stays invisible in RViz.
      use_kinematic_controller: true
      # Start RViz with the package rviz config.
      use_rviz: true

    topics:
      sim_odom: /control/asr_sdm/odom
      # Alternative pose source for the robot model, selected with odom_source:=vins.
      # odom_source:=auto follows whichever of the two published last.
      vins_odom: /localization/video_inertial_navigation_systems/odometry
      initialpose: /control/initial_pose
      joint_states: /control/joint_states
      robot_cmd: /control/asr_sdm/robot_cmd
      controller_state: /control/asr_sdm/controller_state_3d
      control_cmd: /control/asr_sdm/control_cmd_3d
      goal_pose: /goal_pose
      add_static_obstacle: /simulator/planning_simulator/add_static_obstacle

    odom_visualization:
      color: {a: 0.8, r: 1.0, g: 0.0, b: 0.0}
      covariance_scale: 100.0

    robot_model:
      # URDF root is base (ROS +X forward). Same frame as odom / 2D Pose Estimate.
      parent_frame: base
      child_frame: base
      use_sim_time: false
      model_xacro: urdf/asr_sdm_wrapper.urdf.xacro
