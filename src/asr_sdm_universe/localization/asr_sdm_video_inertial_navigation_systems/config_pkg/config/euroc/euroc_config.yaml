/**:
  ros__parameters:
    # topics / output
    imu_topic: "/imu0"
    image_topic: "/cam0/image_raw"
    output_path: "output"
    pose_graph_save_path: "output/pose_graph"

    # OpenCV-format camera calibration (camodocal); path set by launch
    camera_calibration_file: ""

    # image geometry (must match euroc_cam_calibration.yaml)
    image_width: 752
    image_height: 480
    projection_fx: 461.6
    projection_fy: 460.3
    projection_cx: 363.0
    projection_cy: 248.1

    # feature tracker
    max_cnt: 150
    min_dist: 30
    freq: 10
    F_threshold: 1.0
    show_track: 1
    equalize: 0
    fisheye: 0

    # sparse align (default off for EuRoC)
    use_sparse_align: 0
    use_td_pre_calib: 0
    sparse_align_patch_size: 4
    sparse_align_max_level: 3
    sparse_align_min_level: 1
    sparse_align_max_iter: 8
    sparse_align_lambda_rot: 0.5
    sparse_align_lambda_trans: 0.0
    sparse_align_chi2_thresh: 50.0
    sparse_align_min_features: 30
    sparse_align_min_iter_for_ok: 2

    # estimator / imu
    max_solver_time: 0.04
    max_num_iterations: 8
    keyframe_parallax: 10.0
    acc_n: 0.08
    acc_w: 0.00004
    gyr_n: 0.004
    gyr_w: 0.000002
    g_norm: 9.81007

    # extrinsic (row-major 3x3 rotation, camera-to-IMU)
    estimate_extrinsic: 0
    extrinsic_rotation: [0.0148655429818, -0.999880929698, 0.00414029679422,
                         0.999557249008, 0.0149672133247, 0.025715529948,
                         -0.0257744366974, 0.00375618835797, 0.999660727178]
    extrinsic_translation: [-0.0216401454975, -0.064676986768, 0.00981073058949]

    # td / rolling shutter
    estimate_td: 0
    td: 0.0
    rolling_shutter: 0
    rolling_shutter_tr: 0.0

    # pose graph
    loop_closure: 1
    load_previous_pose_graph: 0
    fast_relocalization: 0
    save_image: 1
    visualize_imu_forward: 0
    visualize_camera_size: 0.4
