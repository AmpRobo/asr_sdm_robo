/**:
  ros__parameters:
    # topics / output  (matches rosbag generated by tumvi_to_ros2bag.py)
    imu_topic: "/imu0"
    image_topic: "/cam0/image_raw"
    output_path: "output"
    pose_graph_save_path: "output/pose_graph"

    # OpenCV-format camera calibration (camodocal); path set by launch
    camera_calibration_file: ""

    # image geometry (must match tumvi_cam_calibration.yaml)
    image_width: 512
    image_height: 512
    # Intrinsics must match tumvi_cam_calibration.yaml (mu, mv, u0, v0).
    projection_fx: 190.978
    projection_fy: 190.978
    projection_cx: 254.932
    projection_cy: 256.897

    # feature tracker
    max_cnt: 150
    min_dist: 30
    freq: 20                # TUM-VI cam0 publishes at 20 Hz
    F_threshold: 1.0
    show_track: 1
    equalize: 0
    # TUM-VI room1 uses 195 deg equidistant fisheye lenses.  The Kannala-Brandt
    # distortion model is loaded from tumvi_cam_calibration.yaml (model_type:
    # KANNALA_BRANDT).  We keep `fisheye: 0` here so that feature_tracker skips
    # the legacy fisheye_mask path (which expects a non-existent
    # fisheye_mask.jpg masked for a 752x480 image).  The actual back-projection
    # still uses EquidistantCamera because generateCameraFromYamlFile() selects
    # the model from the YAML, not from this flag.
    fisheye: 0

    # sparse align (default ON for TUM-VI per vins_tumvi.yaml)
    use_sparse_align: 0
    use_td_pre_calib: 0
    sparse_align_patch_size: 2
    sparse_align_max_level: 1
    sparse_align_min_level: 1
    sparse_align_max_iter: 1
    sparse_align_lambda_rot: 1.0
    sparse_align_lambda_trans: 0.0
    sparse_align_chi2_thresh: 25.0
    sparse_align_min_features: 25
    sparse_align_min_iter_for_ok: 1

    # estimator / imu
    # Allan-plot noise values match the original HKUST VINS-Mono TUM-VI reference
    #   (https://github.com/HKUST-Aerial-Robotics/VINS-Mono/blob/master/config/tum/tum_config.yaml).
    # The previous values (acc_n=0.0028, gyr_n=0.00016, acc_w=0.00086) were 7-25x
    #   lower than upstream, causing the optimizer to over-trust the IMU and
    #   attribute visual reprojection error to IMU bias, leading to large drift.
    max_solver_time: 0.04
    max_num_iterations: 8
    keyframe_parallax: 10.0
    acc_n: 0.04
    acc_w: 0.0004
    gyr_n: 0.004
    gyr_w: 0.00002
    g_norm: 9.80766

    # extrinsic (camera-to-IMU, row-major 3x3 rotation) from original
    #   HKUST VINS-Mono config/tum/tum_config.yaml (same TUM-VI room1 sequence).
    # Imported verbatim on 2026-07-18 because the previous values came from
    #   datasheet/dataset-room1_512_16_origin/dso/camchain.yaml and differed from
    # the upstream VINS-Mono reference by ~1.2° rotation / 33 mm translation,
    #   which alone explains >0.7 m ATE on room1.  The original comments said
    #   "imu^R_cam" so this is the imu-from-cam rotation, as expected.
    # Reference: https://github.com/HKUST-Aerial-Robotics/VINS-Mono/blob/master/config/tum/tum_config.yaml
    estimate_extrinsic: 0   # 0 = use values below; 2 = refine online
    extrinsic_rotation: [-9.9951465899298464e-01, 7.5842033363785165e-03, -3.0214670573904204e-02,
                         2.9940114644659861e-02, -3.4023430206013172e-02, -9.9897246995704592e-01,
                        -8.6044170750674241e-03, -9.9939225835343004e-01, 3.3779845322755464e-02]
    extrinsic_translation: [4.4511917113940799e-02, -7.3197096234105752e-02, -4.7972907300764499e-02]

    # td / rolling shutter (TUM-VI cameras are global shutter)
    estimate_td: 0
    td: 0.0
    rolling_shutter: 0
    rolling_shutter_tr: 0.0

    # pose graph
    loop_closure: 1
    load_previous_pose_graph: 0
    fast_relocalization: 0
    save_image: 1
    visualize_imu_forward: 0
    visualize_camera_size: 0.4