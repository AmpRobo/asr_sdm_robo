/**:
  ros__parameters:
    # ---- runtime config (paths relative to config_pkg share) --------------
    params_file: config/euroc/euroc_config.yaml
    calibration_file: config/euroc/euroc_cam_calibration.yaml
    config_file: ""

    # When true, override runtime yaml with sparse_align settings below
    enable_sparse: true

    # Applied only when enable_sparse is true
    sparse_align:
      use_sparse_align: 1
      use_td_pre_calib: 1
      sparse_align_patch_size: 2
      sparse_align_max_level: 2
      sparse_align_min_level: 0
      sparse_align_max_iter: 4
      sparse_align_lambda_rot: 0.5
      sparse_align_lambda_trans: 0.0
      sparse_align_chi2_thresh: 50.0
      sparse_align_min_features: 30
      sparse_align_min_iter_for_ok: 1

    # ---- pipeline layout --------------------------------------------------
    namespace: localization
    rviz_config: config/vins_euroc_rviz.rviz

    pose_graph:
      visualization_shift_x: 0
      visualization_shift_y: 0
      skip_cnt: 0
      skip_dis: 0.0
