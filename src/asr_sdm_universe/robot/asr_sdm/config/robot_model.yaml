# Default configuration for asr_sdm_description.launch.py.
# Callers can pass their own file with the same schema via config_file:=<path>,
# which is what planning_simulator does with its own config.

features:
  # Load the URDF and publish the model transforms.
  use_asr_sdm_model: true

topics:
  # robot_state_publisher listens here for the joint angles to animate.
  joint_states: /control/joint_states

robot_model:
  # Mesh is modeled along +Z; pitch +90 deg lays the body in the XY plane.
  # Yaw +180 deg aligns the visual heading with odom / 2D Pose Estimate.
  parent_frame: base
  child_frame: screwdrive_segment_0
  yaw_rad: 3.141592653589793
  pitch_rad: 1.5707963267948966
  use_sim_time: false
  # Paths are resolved against the asr_sdm share directory.
  model_xacro: urdf/asr_sdm_wrapper.urdf.xacro
