random_map_sensing:
  ros__parameters:
    init_state_x: 0.0
    init_state_y: 0.0

    map:
      # random_forest | perlin3d | post2d | maze2d | maze3d. Overridden by the launch
      # argument map_type. All types share the size / resolution / clearance settings;
      # clear_radius also carves the start and protect points out of the mockamap types.
      type: random_forest
      # Negative seeds from std::random_device (a new map each run).
      seed: -1
      x_size: 20.0
      y_size: 20.0
      z_size: 5.0
      obs_num: 30
      resolution: 0.1
      circle_num: 6
      clear_radius: 2.0
      protect_x: 19.0
      protect_y: 0.0

    ObstacleShape:
      lower_rad: 0.3
      upper_rad: 0.8
      lower_hei: 3.0
      upper_hei: 7.0
      radius_l: 7.0
      radius_h: 7.0
      z_l: 7.0
      z_h: 7.0
      theta: 7.0
      # Tube diameter of each elliptical ring, in meters. 0 keeps a thin centerline.
      thickness: 0.4

    # The sections below are the map types ported from mockamap.
    # Volumetric Perlin noise thresholded to a fill ratio, up to map.z_size.
    perlin3d:
      # Base noise frequency per voxel (depends on map.resolution); larger is more complex.
      complexity: 0.03
      # Occupied fraction of the volume.
      fill: 0.1
      # Number of octaves; larger adds detail.
      fractal: 1
      # Amplitude falloff between octaves.
      attenuation: 0.1

    # Hollow boxes with random footprint and height up to map.z_size.
    post2d:
      width_min: 0.6
      width_max: 1.5
      obstacle_number: 50

    # Recursive-division maze; walls span the full map.z_size.
    maze2d:
      road_width: 1.0
      # Close the map borders: add_wall_x on the y = min/max edges, add_wall_y on x = min/max.
      add_wall_x: false
      add_wall_y: false

    # Voronoi-cell maze: walls on the bisector planes between random nodes.
    maze3d:
      num_nodes: 20
      # Fraction of walls that get a hole.
      connectivity: 0.5
      # Hole size, in voxels.
      road_radius: 4

    sensing:
      radius: 10.0
      # Republishes the whole global map each tick; RViz and the planner's ESDF both
      # re-process it. Clicked obstacles are published immediately regardless.
      rate: 5.0
      publish_local: false
      enable_click_map: true

    topics:
      local_cloud: /asr_sdm_map_generator/local_cloud
      global_cloud: /asr_sdm_map_generator/global_cloud
      click_map: /pcl_render_node/local_map
      odometry: odometry
      # RViz "Static Obstacle" tool publishes PoseStamped here.
      add_static_obstacle: /simulator/planning_simulator/add_static_obstacle
