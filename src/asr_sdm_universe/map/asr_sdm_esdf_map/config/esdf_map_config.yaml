esdf_map:
  ros__parameters:
    # The nested block is exposed as dotted ROS 2 parameter names such as
    # esdf_map.resolution, matching the names declared by the C++ library.
    esdf_map:
      # ---- Map geometry ----
      # Target grid resolution. ESDF computation and the RViz CUBE_LIST voxel
      # edge length both use this single parameter.
      resolution: 0.15
      map_size_x: 120.0
      map_size_y: 120.0
      map_size_z: 6.0

      # ---- Local update window and obstacle inflation ----
      local_update_range_x: 5.0
      local_update_range_y: 5.0
      local_update_range_z: 3.0
      obstacles_inflation: 0.30
      local_bound_inflate: 1.0
      local_map_margin: 1
      ground_height: -1.0

      # ---- Camera intrinsics for the depth chain ----
      fx: 458.0
      fy: 458.0
      cx: 320.0
      cy: 240.0

      # ---- Depth-image filtering ----
      use_depth_filter: true
      depth_filter_tolerance: 0.15
      depth_filter_maxdist: 5.0
      depth_filter_mindist: 0.2
      depth_filter_margin: 2
      k_depth_scaling_factor: 1000.0
      skip_pixel: 4

      # ---- Occupancy log-odds fusion ----
      p_hit: 0.70
      p_miss: 0.35
      p_min: 0.12
      p_max: 0.97
      p_occ: 0.80

      # ---- Raycasting bounds ----
      min_ray_length: 0.2
      max_ray_length: 5.0

      # ---- Fast-Planner map update settings ----
      virtual_ceil_height: 3.0
      show_occ_time: false
      show_esdf_time: false

      # ESDFMap subscribes to these three input topics. Depth and odometry are
      # approximately synchronized; PointCloud and odometry form the
      # independent Fast-Planner point-cloud chain.
      depth_topic: "/sensing/camera/realsense/depth"
      odom_topic: "/localization/video_inertial_navigation_systems/odometry"
      cloud_topic: "/localization/video_inertial_navigation_systems/point_cloud"
      simulation_cloud_topic: "/asr_sdm_map_generator/global_cloud"
      simulation_odom_topic: "/visual_slam/odom"

      # ---- Global feature switches ----
      # This YAML file is the only configuration source used by the launch
      # file. Change switches here; launch does not override them.
      enable_depth_odom: false
      enable_pointcloud_odom: true
      # Enable both simulation point-cloud and odometry subscriptions.
      enable_simulation_cloud_odom: true

      # ---- Preloaded binary map ----
      # A relative directory is resolved against
      # share/asr_sdm_esdf_map. Use "" to disable preloading.
      preload_map_directory: ""
      preload_occupancy_filename: "occupancy.bin"
      preload_esdf_filename: "esdf.bin"

      # Resolution used when the .bin files were generated. The files store
      # world-frame voxel centers but do not store their voxel size.
      preload_source_resolution: 0.15

    # Visualization belongs to the test executable, not the reusable library.
    test:
      frame_id: "world"
      visualization_truncate_height: 3.0
      esdf_max_valid_distance: 1000.0
      publish_period: 0.5

      # Standard odometry visualization: nav_msgs/Path is distance-sampled and
      # bounded so long-running tests do not grow memory or messages forever.
      odometry_path_min_distance: 0.05
      odometry_path_max_poses: 5000
